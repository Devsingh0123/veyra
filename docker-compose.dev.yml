version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: veyra-mongodb-dev
    ports:
      - "27017:27017"
    volumes:
      - mongodb_dev_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - veyra-network

  redis:
    image: redis:7-alpine
    container_name: veyra-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - veyra-network

volumes:
  mongodb_dev_data:
  redis_dev_data:

networks:
  veyra-network:
    driver: bridge
